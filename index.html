<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BoviTrack</title><meta name="theme-color" content="#176b45">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BoviTrack">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
<style>
:root{--g:#176b45;--bg:#f4f7f5;--line:#dbe5df;--red:#b42318;--amber:#b54708}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial;background:var(--bg);color:#18221c}
header{background:var(--g);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
header img{width:58px;height:58px;border-radius:50%}header strong{font-size:24px}header small{display:block;opacity:.9}
main{max-width:1000px;margin:auto;padding:16px}.nav,.actions{display:flex;gap:8px;flex-wrap:wrap}.nav{margin-bottom:14px}
button{border:0;border-radius:10px;padding:11px 14px;font-weight:700;background:var(--g);color:white}.secondary{background:#e9efeb;color:#17211b}.danger{background:#fdeceb;color:var(--red)}
.card{background:white;border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #00000008}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric b{display:block;font-size:30px;color:var(--g)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:13px;font-weight:700}
input{width:100%;padding:11px;margin:5px 0 12px;border:1px solid #cbd8d0;border-radius:9px;font-size:16px}
.scan{padding:16px;background:#eef7f2;border:2px dashed #86b69d;border-radius:12px}
table{width:100%;border-collapse:collapse;margin-top:10px}th,td{text-align:left;padding:9px;border-bottom:1px solid #e8eee9;font-size:14px}
.ok{color:var(--g);font-weight:800}.bad{color:var(--red);font-weight:800}.warn{color:var(--amber);font-weight:800}.hidden{display:none}
.pill{display:inline-block;padding:4px 8px;margin:3px;border-radius:20px;background:#eaf5ef;color:var(--g);font-size:12px;font-weight:700}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}table{display:block;overflow:auto}}
</style>
</head>
<body>
<header><img src="bovitrack-logo.png" alt="BoviTrack"><div><strong>BoviTrack</strong><small>Selecciona • Verifica • Controla</small></div></header>
<main>
<div class="nav"><button onclick="show('home')">Inicio</button><button class="secondary" onclick="show('select')">Nueva selección</button><button class="secondary" onclick="show('receive')">Verificar recepción</button></div>
<section id="home"><div class="grid">
<div class="card metric">Seleccionados<b id="mSel">0</b></div><div class="card metric">Recibidos<b id="mRec">0</b></div>
<div class="card metric">Correctos<b id="mOk">0</b></div><div class="card metric">Faltantes<b id="mMiss">0</b></div></div>
<div class="card"><h2>Operación actual</h2><div id="summary">Sin selección activa.</div><div class="actions" style="margin-top:12px"><button onclick="exportCSV()">Exportar CSV/Excel</button><button class="secondary" onclick="newOp()">Nueva operación</button></div></div></section>
<section id="select" class="hidden"><div class="card"><h2>Nueva selección</h2><div class="row"><div><label>Proveedor / Predio</label><input id="predio"></div><div><label>Lote</label><input id="lote"></div></div><div class="row"><div><label>Cantidad objetivo</label><input id="meta" type="number"></div><div><label>Fecha</label><input id="fecha" type="date"></div></div><button onclick="saveOp()">Guardar datos</button></div>
<div class="card"><h2>Escanear animales seleccionados</h2><div class="scan"><input id="selChip" placeholder="Escanear o ingresar DIIO/RFID" onkeydown="if(event.key==='Enter')addSel()"><button onclick="addSel()">Registrar</button></div><div id="selMsg"></div><table><thead><tr><th>#</th><th>DIIO/RFID</th><th>Fecha/Hora</th><th></th></tr></thead><tbody id="selTable"></tbody></table></div></section>
<section id="receive" class="hidden"><div class="card"><h2>Datos de recepción</h2><div class="row"><div><label>Patente camión</label><input id="patente"></div><div><label>Nombre chofer</label><input id="chofer"></div></div><button onclick="saveTransport()">Guardar</button></div>
<div class="card"><h2>Verificar animales recibidos</h2><div class="scan"><input id="recChip" placeholder="Escanear o ingresar DIIO/RFID" onkeydown="if(event.key==='Enter')addRec()"><button onclick="addRec()">Verificar</button></div><div id="recMsg"></div><table><thead><tr><th>#</th><th>DIIO/RFID</th><th>Resultado</th><th>Hora</th><th></th></tr></thead><tbody id="recTable"></tbody></table><h3>Faltantes</h3><div id="missing"></div></div></section>
</main>
<script>
const $=x=>document.getElementById(x);let d=JSON.parse(localStorage.getItem('bovitrack_final')||'{"op":{},"selected":[],"received":[],"transport":{}}');
function save(){localStorage.setItem('bovitrack_final',JSON.stringify(d));render()}
function show(x){['home','select','receive'].forEach(y=>$(y).classList.toggle('hidden',x!==y));render()}
function norm(x){return x.trim().replace(/\s+/g,'')}
function saveOp(){d.op={predio:$('predio').value,lote:$('lote').value,meta:$('meta').value,fecha:$('fecha').value};save();$('selMsg').innerHTML='<p class="ok">✓ Datos guardados</p>'}
function addSel(){let c=norm($('selChip').value);if(!c)return;if(d.selected.some(x=>x.chip===c)){$('selMsg').innerHTML='<p class="warn">⚠ Lectura repetida</p>';return}d.selected.push({chip:c,time:new Date().toLocaleString('es-CL')});$('selChip').value='';save();$('selChip').focus()}
function saveTransport(){d.transport={patente:$('patente').value,chofer:$('chofer').value};save()}
function addRec(){let c=norm($('recChip').value);if(!c)return;if(d.received.some(x=>x.chip===c)){$('recMsg').innerHTML='<p class="warn">⚠ Ya verificado</p>';return}let ok=d.selected.some(x=>x.chip===c);d.received.push({chip:c,time:new Date().toLocaleString('es-CL'),ok});$('recChip').value='';$('recMsg').innerHTML=ok?'<p class="ok">✓ CORRECTO</p>':'<p class="bad">✕ NO CORRESPONDE</p>';save();$('recChip').focus()}
function del(t,i){if(confirm('¿Eliminar esta lectura?')){d[t].splice(i,1);save()}}
function render(){let s=new Set(d.selected.map(x=>x.chip)),r=new Set(d.received.map(x=>x.chip)),miss=d.selected.filter(x=>!r.has(x.chip)),ok=d.received.filter(x=>s.has(x.chip));
$('mSel').textContent=d.selected.length;$('mRec').textContent=d.received.length;$('mOk').textContent=ok.length;$('mMiss').textContent=miss.length;
$('summary').innerHTML=d.op.predio?`<b>${d.op.predio}</b> · ${d.op.lote||''}<br><span class="pill">Objetivo: ${d.op.meta||'—'}</span><span class="pill">Patente: ${d.transport.patente||'—'}</span><span class="pill">Chofer: ${d.transport.chofer||'—'}</span>`:'Sin selección activa.';
$('selTable').innerHTML=d.selected.map((x,i)=>`<tr><td>${i+1}</td><td>${x.chip}</td><td>${x.time}</td><td><button class="danger" onclick="del('selected',${i})">Eliminar</button></td></tr>`).join('');
$('recTable').innerHTML=d.received.map((x,i)=>`<tr><td>${i+1}</td><td>${x.chip}</td><td class="${x.ok?'ok':'bad'}">${x.ok?'Correcto':'No seleccionado'}</td><td>${x.time}</td><td><button class="danger" onclick="del('received',${i})">Eliminar</button></td></tr>`).join('');
$('missing').innerHTML=miss.length?miss.map(x=>`<span class="pill">${x.chip}</span>`).join(''):'<span class="ok">Sin faltantes</span>';
$('predio').value=d.op.predio||'';$('lote').value=d.op.lote||'';$('meta').value=d.op.meta||'';$('fecha').value=d.op.fecha||'';$('patente').value=d.transport.patente||'';$('chofer').value=d.transport.chofer||''}
function exportCSV(){let s=new Set(d.selected.map(x=>x.chip)),r=new Set(d.received.map(x=>x.chip)),all=[...new Set([...s,...r])],rows=[['DIIO/RFID','Seleccionado','Recibido','Resultado','Predio','Lote','Patente','Chofer']];all.forEach(c=>rows.push([c,s.has(c)?'Sí':'No',r.has(c)?'Sí':'No',s.has(c)&&r.has(c)?'Correcto':s.has(c)?'Faltante':'No seleccionado',d.op.predio||'',d.op.lote||'',d.transport.patente||'',d.transport.chofer||'']));let csv='\ufeff'+rows.map(a=>a.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='BoviTrack_'+(d.op.lote||'reporte')+'.csv';a.click()}
function newOp(){if(confirm('¿Borrar la operación actual y comenzar otra?')){d={op:{},selected:[],received:[],transport:{}};save()}}
if(!$('fecha').value)$('fecha').valueAsDate=new Date();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
